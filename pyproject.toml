[project]
name = "go-opps"
version = "0.0.1"
description = "Python modules for the GO Project outreach-opportunities solution."
readme = "README.md"
# Match a Databricks Runtime Python version (DBR 15.4 LTS ships 3.11).
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "databricks-connect>=15.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["go_opps"]

[tool.uv]
# Keep the project package itself out of the locked dependency set; it is
# installed as an editable/local package instead.
package = true
