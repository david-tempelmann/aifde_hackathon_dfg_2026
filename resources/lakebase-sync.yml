# Gold sync — replicate the UC gold_* Delta tables into the Lakebase `gold`
# Postgres schema the app reads. Avoids needing CREATE CATALOG by targeting an
# existing UC catalog (ai_fde_hackathon_catalog) as the synced_table_id
# destination rather than a new database catalog. SNAPSHOT policy: each run
# full-copies the source — no CDF / row tracking needed, and robust to the Gold
# job's CREATE OR REPLACE. Trigger a run to pick up fresh Gold data. Destination
# names drop the `gold_` prefix, so the app reads gold.opportunity_cards etc.
resources:
  postgres_synced_tables:
    gold_dim_issues:
      synced_table_id: ai_fde_hackathon_catalog.gold.dim_issues
      branch: ${resources.postgres_branches.production.name}
      postgres_database: databricks_postgres
      source_table_full_name: ai_fde_hackathon_catalog.brickhearts.gold_dim_issues
      primary_key_columns: [issue_id]
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ai_fde_hackathon_catalog
        storage_schema: brickhearts_sync
    gold_dim_places:
      synced_table_id: ai_fde_hackathon_catalog.gold.dim_places
      branch: ${resources.postgres_branches.production.name}
      postgres_database: databricks_postgres
      source_table_full_name: ai_fde_hackathon_catalog.brickhearts.gold_dim_places
      primary_key_columns: [place_id]
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ai_fde_hackathon_catalog
        storage_schema: brickhearts_sync
    gold_opportunity_cards:
      synced_table_id: ai_fde_hackathon_catalog.gold.opportunity_cards
      branch: ${resources.postgres_branches.production.name}
      postgres_database: databricks_postgres
      source_table_full_name: ai_fde_hackathon_catalog.brickhearts.gold_opportunity_cards
      primary_key_columns: [opportunity_id]
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ai_fde_hackathon_catalog
        storage_schema: brickhearts_sync
    gold_opportunity_details:
      synced_table_id: ai_fde_hackathon_catalog.gold.opportunity_details
      branch: ${resources.postgres_branches.production.name}
      postgres_database: databricks_postgres
      source_table_full_name: ai_fde_hackathon_catalog.brickhearts.gold_opportunity_details
      primary_key_columns: [opportunity_id]
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ai_fde_hackathon_catalog
        storage_schema: brickhearts_sync
    gold_opportunity_citations:
      synced_table_id: ai_fde_hackathon_catalog.gold.opportunity_citations
      branch: ${resources.postgres_branches.production.name}
      postgres_database: databricks_postgres
      source_table_full_name: ai_fde_hackathon_catalog.brickhearts.gold_opportunity_citations
      primary_key_columns: [citation_id]
      scheduling_policy: SNAPSHOT
      create_database_objects_if_missing: true
      new_pipeline_spec:
        storage_catalog: ai_fde_hackathon_catalog
        storage_schema: brickhearts_sync
