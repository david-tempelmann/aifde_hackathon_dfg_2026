# Scheduled refresh of the Lakebase Gold synced tables. The synced tables use
# SNAPSHOT scheduling (they don't auto-run), so this job triggers all of them on
# a schedule — intended to run shortly after the morning UC Gold rebuild. A
# routine snapshot reloads in place, so the app SP read grant persists (only a
# structural recreate would need grant_app_sp.sql re-run).
resources:
  jobs:
    gold_refresh:
      name: ${bundle.name}-gold-refresh
      tasks:
        - task_key: refresh_synced_tables
          notebook_task:
            notebook_path: ../notebooks/refresh_gold_sync.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"
      # Daily, 13:00 UTC — adjust to run just after the Gold build completes.
      schedule:
        quartz_cron_expression: "0 0 13 * * ?"
        timezone_id: UTC
        pause_status: UNPAUSED
      queue:
        enabled: true
